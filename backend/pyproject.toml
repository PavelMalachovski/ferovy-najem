[project]
name = "ferovy-najem-backend"
version = "0.1.0"
description = "Backend API for Férový nájem"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "cbor2>=6.3.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyogrio>=0.13.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "shapely>=2.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
