name: FerovyNajem
options:
  bundleIdPrefix: cz.ferovynajem
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FerovyNajem:
    type: application
    platform: iOS
    sources:
      - FerovyNajem
    info:
      path: FerovyNajem/Info.plist
      properties:
        CFBundleDisplayName: Férový nájem
        CFBundleLocalizations: [en, cs]
        APIBaseURL: $(API_BASE_URL)
        # Plain HTTP only to localhost / LAN (Simulator → Docker backend). No arbitrary loads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.ferovynajem.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: "\"FerovyNajem/Preview Content\""
      configs:
        Debug:
          API_BASE_URL: http://localhost:8000
        Release:
          API_BASE_URL: https://api.ferovynajem.invalid  # set in M4 (deploy)

  FerovyNajemTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FerovyNajemTests
      - path: "FerovyNajem/Preview Content/Fixtures"
        type: folder
        buildPhase: resources
    dependencies:
      - target: FerovyNajem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cz.ferovynajem.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FerovyNajem.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FerovyNajem
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  FerovyNajem:
    build:
      targets:
        FerovyNajem: all
        FerovyNajemTests: [test]
    test:
      targets:
        - FerovyNajemTests
